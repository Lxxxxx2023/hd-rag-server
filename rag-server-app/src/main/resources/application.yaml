server:
  port: 8080

spring:
  application:
    name: hd-rag-server

  # ==================== OpenAI Embedding ====================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      embedding:
        model: text-embedding-3-small

  # ==================== MySQL Datasource (Druid) ====================
  datasource:
    url: jdbc:mysql://localhost:3306/rag_server?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ==================== Elasticsearch ====================
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

# ==================== MyBatis ====================
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.hd.rag.infrastructure.dao.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl