schema: spec-driven

context: |
  Tech stack: Java 17, Spring Boot 3.4.3, Maven (multi-module), MyBatis-Plus 3.0.4, MySQL 9.1.0, Druid 1.2.23
  AI: Spring AI 1.1.5, OpenAI-compatible API, SSE streaming
  Search: Elasticsearch, pgvector
  Message: Kafka
  Cache: Redis
  Other: Lombok 1.18.36

  Module structure:
  - rag-server-types: 系统常量、通用方法、共享 POJOs（跨模块共享，与具体领域无关）
  - rag-server-domain: 领域模型（聚合根、实体、值对象、枚举）、领域服务、仓储接口与 Port 接口
  - rag-server-infrastructure: 实现 domain 定义的接口 — 仓储适配器、Port 适配器、DAO/PO、Gateway、Redis、配置
  - rag-server-api: API 接口定义与 DTO（Request/Response）
  - rag-server-case: 跨领域业务编排、流程串联、事务管理
  - rag-server-trigger: HTTP 控制器、MQ 消费者、定时任务（仅路由转发，不含业务逻辑）
  - rag-server-app: 应用入口，Spring Boot 自动装配（composition root，依赖所有模块）

  Architecture: DDD 六边形架构
  - 依赖方向: Trigger → API → Case → Domain ← Infrastructure
  - Domain 定义仓储接口（IRepository）和 Port 接口，Infrastructure 实现这些接口（依赖倒置）
  - Trigger 仅负责接收请求、参数校验、路由转发，不包含业务逻辑
  - Case 层负责跨领域编排和事务管理；简单业务可跳过 Case，Trigger 直接调用 Domain Service
  - App 模块作为 composition root，负责依赖注入和自动装配，依赖所有模块

  Conventions:
  - Package root: com.hd.rag
  - 中文文档，英文代码标识符
  - 策略模式: 接口定义在 domain，实现在 infrastructure
  - Controller 在 trigger/http/，使用 @Tag + @Operation 注解
  - 配置类在 infrastructure/config/
  - Domain: RAG 中台服务 — 为多业务线提供统一的检索增强生成能力

rules:
  proposal:
    - 中文撰写，包含 Summary / Motivation / Core Design Decisions / Non-goals
    - 设计决策用表格，含序号、决策、说明三列
  design:
    - 中文撰写，标注 DDD 分层依赖方向
    - 数据模型用 Java 代码块，策略接口用 Java interface 代码块
    - 配置示例用 JSON，API 用 method + path + 说明表格
  tasks:
    - 按 DDD 分层组织：types → domain → infrastructure → api → case → trigger → app
    - 每个 task 对应一个类或方法变更，标注依赖关系
